# Verify final upload bytes; browser and E2E execution remains on authorized remote hosts.
name: Public artifact security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build public artifact
        run: |
          node scripts/build.mjs
      - name: Refuse credential or private-file publication
        run: sh .security/scan.sh
