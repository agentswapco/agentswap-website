<!-- Homepage icons for wallet funding, permissions, swaps and intent orders.
     Exports: wallet, permission, swap and intent SVG symbols, each on a 32 × 32 grid.
     Dependencies: currentColor supplied by the canonical site palette. -->
<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="wallet" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M6 9V6h17v5M6 9h20v17H6z"/>
      <path d="M26 16h-7v6h7"/>
      <path d="M22 19h1"/>
    </g>
  </symbol>
  <symbol id="permission" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
